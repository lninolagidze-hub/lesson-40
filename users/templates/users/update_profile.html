<!DOCTYPE html>

<html> <head> <title>Update Profile</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        background-color: #fff0f5;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #4a2140;
    }

    .update-box {
        width: 450px;
        background-color: white;
        padding: 35px;
        border-radius: 25px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
    }

    h1 {
        text-align: center;
        color: #c2185b;
        margin-bottom: 30px;
    }

    form p {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        color: #8b3a62;
    }

    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #e1a7bd;
        border-radius: 12px;
        box-sizing: border-box;
        font-size: 15px;
    }

    input:focus {
        outline: none;
        border-color: #c2185b;
    }

    .update-button {
        width: 100%;
        padding: 13px;
        margin-top: 10px;
        background-color: #c2185b;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .update-button:hover {
        background-color: #880e4f;
    }

    .back {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #c2185b;
        text-decoration: none;
        font-weight: bold;
    }

    .back:hover {
        color: #880e4f;
    }

    .errorlist {
        color: #d32f2f;
        font-size: 14px;
    }
</style>

</head>

<body>

<div class="update-box">

    <h1>Update Profile</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button class="update-button" type="submit">
            Update
        </button>
    </form>

    <a class="back" href="{% url 'profile' %}">
        ← Back to Profile
    </a>

</div>

</body> </html>
