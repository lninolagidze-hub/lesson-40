<!DOCTYPE html>

<html>
<head>
    <title>Login</title>

```
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        background-color: #fff0f5;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #4a2140;
    }

    .login-box {
        width: 400px;
        background-color: white;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
    }

    h1 {
        text-align: center;
        color: #c2185b;
        margin-bottom: 30px;
    }

    form p {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        color: #8b3a62;
    }

    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #e1a7bd;
        border-radius: 10px;
        box-sizing: border-box;
        font-size: 15px;
    }

    input:focus {
        outline: none;
        border-color: #c2185b;
    }

    .login-button {
        width: 100%;
        padding: 13px;
        margin-top: 10px;
        background-color: #c2185b;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .login-button:hover {
        background-color: #880e4f;
    }

    .error {
        background-color: #ffe0e6;
        color: #c62828;
        padding: 10px;
        border-radius: 10px;
        margin-bottom: 20px;
        text-align: center;
    }

    .register-link {
        text-align: center;
        margin-top: 20px;
    }

    .register-link a {
        color: #c2185b;
        text-decoration: none;
        font-weight: bold;
    }

    .register-link a:hover {
        color: #880e4f;
    }
</style>
```

</head>

<body>

```
<div class="login-box">

    <h1>Login</h1>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <p>
            <label for="username">Username:</label>
            <input
                type="text"
                name="username"
                id="username"
                required
            >
        </p>

        <p>
            <label for="password">Password:</label>
            <input
                type="password"
                name="password"
                id="password"
                required
            >
        </p>

        <button class="login-button" type="submit">
            Login
        </button>
    </form>

    <div class="register-link">
        Don't have an account?
        <a href="{% url 'register' %}">Register</a>
    </div>

</div>
```

</body>
</html>
