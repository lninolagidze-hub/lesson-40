<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Set New Password</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #fff5fa;
            color: #4a2140;
        }

        .container {
            max-width: 500px;
            margin: 100px auto;
            padding: 20px;
        }

        .box {
            background-color: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #c2185b;
            margin-bottom: 30px;
        }

        form p {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #8b3a62;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #c2185b;
        }

        button {
            width: 100%;
            background-color: #c2185b;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #880e4f;
        }

        .error {
            color: #d6336c;
            text-align: center;
            font-weight: bold;
        }
    </style>

</head>

<body>

<div class="container">

    <div class="box">

        <h1>Set New Password</h1>

        {% if validlink %}

            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit">
                    Change Password
                </button>

            </form>

        {% else %}

            <p class="error">
                This password reset link is invalid or has expired.
            </p>

        {% endif %}

    </div>

</div>

</body>

</html>
