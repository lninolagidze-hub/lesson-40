<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Reset Email Sent</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #fff5fa;
            color: #4a2140;
        }

        .container {
            max-width: 550px;
            margin: 100px auto;
            padding: 20px;
        }

        .box {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
        }

        h1 {
            color: #c2185b;
            margin-bottom: 25px;
        }

        p {
            font-size: 17px;
            line-height: 1.6;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            background-color: #c2185b;
            color: white;
            padding: 12px 22px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .back:hover {
            background-color: #880e4f;
        }
    </style>

</head>

<body>

<div class="container">

    <div class="box">

        <h1>Password Reset Email Sent</h1>

        <p>
            If an account exists with this email address,
            you will receive instructions to reset your password.
        </p>

        <p>
            Please check your email.
        </p>

        <a class="back" href="{% url 'login' %}">
            Back to Login
        </a>

    </div>

</div>

</body>

</html>
