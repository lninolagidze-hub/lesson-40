<!DOCTYPE html>

<html>
<head>
    <title>Register</title>

```
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        background-color: #fff0f5;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #4a2140;
    }

    .register-box {
        width: 400px;
        background-color: white;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
    }

    h1 {
        text-align: center;
        color: #c2185b;
        margin-bottom: 30px;
    }

    form p {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        color: #6a1b4d;
    }

    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #e1a7bd;
        border-radius: 10px;
        box-sizing: border-box;
        font-size: 15px;
    }

    input:focus {
        outline: none;
        border-color: #c2185b;
    }

    .register-button {
        width: 100%;
        padding: 13px;
        margin-top: 10px;
        background-color: #c2185b;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .register-button:hover {
        background-color: #880e4f;
    }

    .login-link {
        text-align: center;
        margin-top: 20px;
    }

    .login-link a {
        color: #c2185b;
        text-decoration: none;
        font-weight: bold;
    }

    .errorlist {
        color: #d32f2f;
        font-size: 14px;
        padding-left: 20px;
    }
</style>
```

</head>

<body>

```
<div class="register-box">

    <h1>Create Account</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button class="register-button" type="submit">
            Register
        </button>
    </form>

    <div class="login-link">
        Already have an account?
        <a href="#">Login</a>
    </div>

</div>
```

</body>
</html>
