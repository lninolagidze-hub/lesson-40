<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Delete {{ product.name }}</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background-color: #fff5fa;
        color: #4a2140;
    }

    .home-button {
        position: absolute;
        top: 20px;
        left: 20px;
        background-color: #c2185b;
        color: white;
        padding: 10px 18px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
    }

    .home-button:hover {
        background-color: #880e4f;
    }

    .container {
        max-width: 600px;
        margin: 100px auto;
        padding: 20px;
    }

    .delete-box {
        background-color: white;
        padding: 35px;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
    }

    h1 {
        color: #c2185b;
        margin-bottom: 25px;
    }

    .product-name {
        font-size: 22px;
        font-weight: bold;
        color: #1976a8;
    }

    .warning {
        margin: 25px 0;
        font-size: 17px;
    }

    .delete-button {
        background-color: #d6336c;
        color: white;
        padding: 12px 22px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .delete-button:hover {
        background-color: #a61e4d;
    }

    .cancel-button {
        display: inline-block;
        margin-left: 10px;
        background-color: #1976a8;
        color: white;
        padding: 12px 22px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
    }

    .cancel-button:hover {
        background-color: #125a80;
    }
</style>
```

</head>

<body>

```
<a class="home-button" href="{% url 'home' %}">
    🏠 Home
</a>

<div class="container">

    <div class="delete-box">

        <h1>Delete Product</h1>

        <p class="warning">
            Are you sure you want to delete:
        </p>

        <p class="product-name">
            {{ product.name }}
        </p>

        <p class="warning">
            This action cannot be undone.
        </p>

        <form method="post">

            {% csrf_token %}

            <button type="submit" class="delete-button">
                🗑️ Delete Product
            </button>

            <a
                class="cancel-button"
                href="{% url 'product_detail' product.id %}">
                Cancel
            </a>

        </form>

    </div>

</div>
```

</body>
</html>
