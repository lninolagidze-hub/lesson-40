{% extends 'base.html' %}

{% block title %}
    Update {{ product.name }}
{% endblock %}

{% block content %}

<style>

    .form-container {
        max-width: 600px;
        margin: 30px auto;
    }

    .form-box {
        background-color: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
    }

    .form-box h1 {
        text-align: center;
        color: #8b3a62;
        margin-bottom: 30px;
    }

    form p {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
        color: #8b3a62;
    }

    input,
    select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 7px;
        box-sizing: border-box;
        font-size: 15px;
    }

    input:focus,
    select:focus {
        outline: none;
        border-color: #c2185b;
    }

    .button {
        width: 100%;
        background-color: #1976a8;
        color: white;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .button:hover {
        background-color: #125a80;
    }

    .back {
        display: inline-block;
        margin-top: 20px;
        color: #8b3a62;
        text-decoration: none;
        font-weight: bold;
    }

    .back:hover {
        text-decoration: underline;
    }

</style>


<div class="form-container">

    <div class="form-box">

        <h1>
            Update {{ product.name }}
        </h1>


        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="button">
                Update Product
            </button>

        </form>


        <a
            class="back"
            href="{% url 'product_detail' product.id %}">
            ← Back to product
        </a>

    </div>

</div>

{% endblock %}
