<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Add Product</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background-color: #fff5fa;
        color: #4a2140;
    }

    .home-button {
        position: absolute;
        top: 20px;
        left: 20px;
        background-color: #c2185b;
        color: white;
        padding: 10px 18px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
    }

    .home-button:hover {
        background-color: #880e4f;
    }

    .container {
        max-width: 600px;
        margin: 80px auto;
        padding: 20px;
    }

    .form-box {
        background-color: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
    }

    h1 {
        text-align: center;
        color: #8b3a62;
        margin-bottom: 30px;
    }

    form p {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
        color: #8b3a62;
    }

    input,
    select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 7px;
        box-sizing: border-box;
        font-size: 15px;
    }

    input:focus,
    select:focus {
        outline: none;
        border-color: #c2185b;
    }

    .checkbox {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .checkbox input {
        width: auto;
    }

    .button {
        width: 100%;
        background-color: #c2185b;
        color: white;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .button:hover {
        background-color: #880e4f;
    }

    .back {
        display: inline-block;
        margin-top: 20px;
        color: #8b3a62;
        text-decoration: none;
        font-weight: bold;
    }

    .back:hover {
        text-decoration: underline;
    }
</style>
```

</head>

<body>

```
<a class="home-button" href="{% url 'home' %}">
    🏠 Home
</a>

<div class="container">

    <div class="form-box">

        <h1>Add New Perfume</h1>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="button">
                Add Product
            </button>

        </form>

        <a class="back" href="{% url 'home' %}">
            ← Back to products
        </a>

    </div>

</div>
```

</body>
</html>
