{% extends 'Sunamoebi/base.html' %}

{% block title %}
    Add Product
{% endblock %}

{% block content %}

<style>

    .form-box {
        max-width: 600px;
        margin: 40px auto;
        background-color: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
    }

    .form-box h1 {
        text-align: center;
        color: #8b3a62;
        margin-bottom: 30px;
    }

    .form-box form p {
        margin-bottom: 20px;
    }

    .form-box label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
        color: #8b3a62;
    }

    .form-box input,
    .form-box select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 7px;
        box-sizing: border-box;
        font-size: 15px;
    }

    .form-box input:focus,
    .form-box select:focus {
        outline: none;
        border-color: #c2185b;
    }

    .form-box input[type="checkbox"] {
        width: auto;
    }

    .form-box button {
        width: 100%;
        background-color: #c2185b;
        color: white;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .form-box button:hover {
        background-color: #880e4f;
    }

    .back {
        display: inline-block;
        margin-top: 20px;
        color: #8b3a62;
        text-decoration: none;
        font-weight: bold;
    }

    .back:hover {
        text-decoration: underline;
    }

</style>


<div class="form-box">

    <h1>
        Add New Perfume
    </h1>


    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}


        <button type="submit">
            Add Product
        </button>

    </form>


    <a class="back" href="{% url 'home' %}">
        ← Back to products
    </a>

</div>

{% endblock %}
